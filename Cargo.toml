[package]
name = "android-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
rmcp = { version = "3.8.0", default-features = false, features = ["client"] }
tokio = { version = "1", features = ["process", "time"] }