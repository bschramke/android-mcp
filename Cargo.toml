[package]
name = "android-mcp"
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.89"
description = "Local stdio MCP server for Android device automation through ADB"
license = "MIT"
repository = "https://github.com/bschramke/android-mcp"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
roxmltree = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "signal"] }
url = "2.5"
protobuf = "3.7"

[build-dependencies]
protobuf-codegen = "3.7"

[dev-dependencies]
rmcp = { version = "3.8.0", default-features = false, features = ["client"] }
tempfile = "3"