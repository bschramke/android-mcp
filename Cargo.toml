[package]
name = "android-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }

[dev-dependencies]
rmcp = { version = "3.8.0", default-features = false, features = ["client"] }
tempfile = "3"