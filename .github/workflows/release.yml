name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "android-mcp") | .version')"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match Cargo version $package_version" >&2
            exit 1
          fi

  build:
    name: Build and test (${{ matrix.target }})
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          name="android-mcp-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p staging dist
          cp "target/${{ matrix.target }}/release/android-mcp" staging/
          cp README.md LICENSE staging/
          tar -C staging -czf "dist/${name}.tar.gz" .

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "android-mcp-$($env:GITHUB_REF_NAME)-${{ matrix.target }}"
          New-Item -ItemType Directory -Force staging, dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/android-mcp.exe" staging/
          Copy-Item README.md, LICENSE -Destination staging/
          Compress-Archive -Path staging/* -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: android-mcp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          pattern: android-mcp-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: cd dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi